name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: agent-python/.python-version

      - name: Install Python tooling
        run: python -m pip install uv==0.13.1

      - name: Install Python dependencies
        working-directory: agent-python
        run: uv sync --locked --group dev

      - name: Check Python formatting, lint, and types
        working-directory: agent-python
        run: |
          uv run --locked ruff format --check src tests
          uv run --locked ruff check src tests
          uv run --locked mypy

      - name: Run Python tests
        working-directory: agent-python
        run: uv run --locked pytest tests

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Build and test backend
        run: mvn --batch-mode clean verify

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend supporting tests
        working-directory: frontend
        run: |
          npm run test:startup
          npm run test:version

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check frontend types and workout workflows
        working-directory: frontend
        run: |
          npm run typecheck
          npm run test:ui
