# Each provider's models. Settings and the eval harness (agent-python/evals) both read this file,
# so it is the only place to change them.
#
#   default    the model a provider uses until the user picks another; the first suggested model
#   suggested  the Settings picker's suggestions, comma-separated, default first
#   cheap      the provider's low-cost suggestion, which `python -m evals --cheap-models` runs
#
# The backend checks every entry when it starts. The eval harness reads this file with a simple
# reader, so keep to plain key=value lines and # comments.

llm.models.openai.default=gpt-6-sol
llm.models.openai.suggested=gpt-6-sol,gpt-6.1-sol,gpt-6-luna
llm.models.openai.cheap=gpt-6-luna

llm.models.anthropic.default=claude-sonnet-5-5
llm.models.anthropic.suggested=claude-sonnet-5-5,claude-opus-5-5,claude-haiku-5-5
llm.models.anthropic.cheap=claude-haiku-5-5

llm.models.deepseek.default=deepseek-flash
llm.models.deepseek.suggested=deepseek-flash
llm.models.deepseek.cheap=deepseek-flash
