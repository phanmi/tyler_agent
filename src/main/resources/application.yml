spring:
  application:
    name: tyler-agent

server:
  port: 8080

openai:
  model: gpt-5.6
  # OpenAI API Key 的沙箱内相对路径；默认 apikey.txt，可用环境变量 OPENAI_KEY_FILE_PATH 覆盖。
  key-file-path: ${OPENAI_KEY_FILE_PATH:apikey.txt}

agent:
  workspace-dir: ${AGENT_WORKSPACE_DIR:}

userinfo:
  # 用户信息 JSON 的沙箱内相对路径；默认 userinfo.json，可用环境变量 USERINFO_FILE_PATH 覆盖。
  file-path: ${USERINFO_FILE_PATH:userinfo.json}
