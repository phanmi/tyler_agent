spring:
  application:
    name: tyler-agent

server:
  port: 8080

openai:
  model: gpt-5.6
  api-key: ${OPENAI_API_KEY:}

agent:
  workspace-dir: ${AGENT_WORKSPACE_DIR:}

userinfo:
  # 用户信息 JSON 的落盘路径；默认项目根目录 userinfo.json，可用环境变量 USERINFO_FILE_PATH 覆盖。
  file-path: ${USERINFO_FILE_PATH:userinfo.json}
