spring:
  application:
    name: tyler-agent

server:
  port: 8080

openai:
  model: gpt-5.6
  # OpenAI API Key 的沙箱内相对路径；默认 apikey.txt，可用环境变量 OPENAI_KEY_FILE_PATH 覆盖。
  key-file-path: ${OPENAI_KEY_FILE_PATH:apikey.txt}

agent:
  workspace-dir: ${AGENT_WORKSPACE_DIR:}

userinfo:
  # 用户信息 JSON 的沙箱内相对路径；默认 userinfo.json，可用环境变量 USERINFO_FILE_PATH 覆盖。
  file-path: ${USERINFO_FILE_PATH:userinfo.json}

chat:
  # 聊天历史的沙箱内相对路径；默认 chat-history.json，可用环境变量 CHAT_HISTORY_FILE_PATH 覆盖。
  history-file-path: ${CHAT_HISTORY_FILE_PATH:chat-history.json}
  # 历史最多保留的消息条数；默认 20，可用环境变量 CHAT_MAX_MESSAGES 覆盖。
  max-messages: ${CHAT_MAX_MESSAGES:20}

food:
  # 食物记录 SQLite 数据库的沙箱内相对路径；默认 food-record.sqlite，可用环境变量 FOOD_DATABASE_PATH 覆盖。
  database-path: ${FOOD_DATABASE_PATH:food-record.sqlite}
  # 食物记录 JSON 的沙箱内相对路径；默认 food-records.json，可用环境变量 FOOD_FILE_PATH 覆盖。
  file-path: ${FOOD_FILE_PATH:food-records.json}
