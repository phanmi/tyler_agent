spring:
  application:
    name: tyler-agent

server:
  # Accept connections only from this computer.
  address: 127.0.0.1
  # Let the operating system choose an available loopback port.
  port: 0

openai:
  # Sandbox-relative API key path; override with OPENAI_KEY_FILE_PATH.
  key-file-path: ${OPENAI_KEY_FILE_PATH:apikey.txt}

llm:
  # Sandbox-relative non-secret settings: active provider and each provider's model.
  settings-file-path: ${LLM_SETTINGS_FILE_PATH:llm-settings.json}
  anthropic:
    # Sandbox-relative Claude API key path; override with ANTHROPIC_KEY_FILE_PATH.
    key-file-path: ${ANTHROPIC_KEY_FILE_PATH:anthropic-key.txt}
  deepseek:
    # Sandbox-relative DeepSeek API key path; override with DEEPSEEK_KEY_FILE_PATH.
    key-file-path: ${DEEPSEEK_KEY_FILE_PATH:deepseek-key.txt}

agent:
  workspace-dir: ${AGENT_WORKSPACE_DIR:}
  # Per-launch token required on every /api request; the desktop launcher sets it.
  # Unset (a backend started by hand) leaves /api open with a startup warning.
  access-token: ${TYLER_ACCESS_TOKEN:}

userinfo:
  # Sandbox-relative profile JSON path; override with USERINFO_FILE_PATH.
  file-path: ${USERINFO_FILE_PATH:userinfo.json}

chat:
  # Sandbox-relative history path; override with CHAT_HISTORY_FILE_PATH.
  history-file-path: ${CHAT_HISTORY_FILE_PATH:chat-history.json}
  # Maximum retained message count; override with CHAT_MAX_MESSAGES.
  max-messages: ${CHAT_MAX_MESSAGES:20}

food:
  # Sandbox-relative food SQLite path; override with FOOD_DATABASE_PATH.
  database-path: ${FOOD_DATABASE_PATH:food-record.sqlite}
