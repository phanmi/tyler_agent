[project]
name = "tyler-agent-worker"
dynamic = ["version"]
description = "Private Python worker for the Tyler agent migration"
requires-python = "==3.12.14"
dependencies = [
    "anthropic==1.14.0",
    "jsonschema==4.26.0",
    "openai==3.31.0",
]

[project.scripts]
tyler-agent-worker = "tyler_agent.worker:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "../.mvn/maven.config"
pattern = '-Drevision=(?P<version>[^\s]+)'

[tool.hatch.build.targets.wheel]
packages = ["src/tyler_agent"]

[tool.uv]
required-version = "==0.13.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pyinstaller==6.22.3",
    "pytest==9.1.1",
    "ruff==0.17.1",
    "types-jsonschema==4.26.0.20261006",
]
